<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><title>TEST-START</title></head>
<body>
<script>
/* Regresní test zápisové stránky: víc kolejí naráz + mínus z klávesnice.
   Otevírá se přes http (ne file:), výsledek je v <title>. */
const fails = [];
function ok(cond, name) { if (!cond) fails.push(name); }

const f = document.createElement('iframe');
f.style.cssText = 'width:390px;height:844px;border:0';
f.src = 'zapis.html?k=test&jmeno=Test';
document.body.appendChild(f);

const t0 = Date.now();
const iv = setInterval(() => {
  const d = f.contentDocument, w = f.contentWindow;
  if (!d) return;
  const btns = d.querySelectorAll('.house');
  if (btns.length < 4) {
    if (Date.now() - t0 > 12000) { clearInterval(iv); document.title = 'FAIL: koleje se nenačetly'; }
    return;
  }
  clearInterval(iv);

  ok(btns.length === 4, 'počet kolejí');
  ok(d.getElementById('ask').classList.contains('show') === false, 'jméno z odkazu → dialog se neotevřel');
  ok(/Test/.test(d.getElementById('who').textContent), 'jméno v hlavičce');

  // dvě koleje naráz
  btns[0].click(); btns[2].click();
  ok(d.querySelectorAll('.house.on').length === 2, 'označené dvě koleje');

  // číslo s mínusem z klávesnice
  const inp = d.getElementById('pts');
  inp.value = '-30';
  inp.dispatchEvent(new w.Event('input', { bubbles: true }));
  ok(inp.value === '-30', 'mínus zůstal v poli: ' + inp.value);
  ok(d.getElementById('sign').textContent.trim() === '－', 'tlačítko ukazuje mínus');

  const send = d.getElementById('send');
  ok(send.disabled === false, 'tlačítko Zapsat je aktivní');
  ok(/do 2 kolejí/.test(send.textContent), 'text tlačítka: ' + send.textContent);
  ok(/−30/.test(send.textContent), 'znaménko v textu: ' + send.textContent);

  // tlačítko ＋/－ přepne znaménko
  d.getElementById('sign').click();
  ok(inp.value === '30', 'přepnutí na plus: ' + inp.value);
  d.getElementById('sign').click();
  ok(inp.value === '-30', 'přepnutí zpět na mínus: ' + inp.value);

  // odznačení koleje
  btns[2].click();
  ok(d.querySelectorAll('.house.on').length === 1, 'po odkliknutí zůstala jedna');
  ok(/Zapsat Havraspár|Zapsat Nebelvír/.test(send.textContent), 'text pro jednu kolej: ' + send.textContent);

  // fáze 2: historie zápisů (seed do localStorage a znovu načíst)
  w.localStorage.setItem('pohar.hist', JSON.stringify([
    { id: 'a', t: Date.now(), kolej: 'nebelvir', body: 10 },
    { id: 'b', t: Date.now() - 86400000, kolej: 'mrzimor', body: -5, poznamka: 'pozn' },
    { id: 'c', t: Date.now(), kolej: 'havraspar', body: 2, rev: true }
  ]));
  f.onload = () => {
    const d2 = f.contentDocument;
    const rows = d2.querySelectorAll('.hrow');
    ok(rows.length === 3, 'v historii tři řádky (' + rows.length + ')');
    ok(/\+10/.test(rows[0].textContent), 'první řádek +10: ' + rows[0].textContent.trim());
    ok(/−5/.test(rows[1].textContent), 'druhý řádek −5');
    ok(rows[2].classList.contains('rev'), 'vrácený zápis je přeškrtnutý');
    ok(d2.getElementById('hist').scrollTop === 0, 'seznam je nahoře');
    ok(d2.getElementById('histWho').textContent === 'Test', 'v hlavičce jméno');
    document.title = fails.length ? 'FAIL: ' + fails.join(' | ') : 'PASS-15';
  };
  w.location.reload();
}, 120);
</script>
</body></html>
