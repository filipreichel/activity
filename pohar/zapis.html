<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0a14">
<title>Zápis bodů — Školní pohár</title>
<link rel="manifest" href="manifest-zapis.webmanifest">
<link rel="icon" href="/icon-192.png">
<style>
  :root{ --gold:#e8c66a; --gold-dim:#a8863c; --card:#161327; --line:#2a2440; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    min-height:100vh; font-family:'Trebuchet MS',system-ui,sans-serif; color:#efe6d2;
    background:radial-gradient(120% 70% at 50% -10%, #1b2340 0%, #0d1020 48%, #06070f 100%);
    padding:14px 14px calc(18px + env(safe-area-inset-bottom));
  }
  header{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
  .title{font-size:15px; letter-spacing:.16em; text-transform:uppercase;
    background:linear-gradient(180deg,#fff3cc,#e8c66a 60%,#9c7a2e);
    -webkit-background-clip:text; background-clip:text; color:transparent}
  .who{font-size:13px; color:#9a927f; border:1px solid var(--line); border-radius:999px; padding:6px 11px;
    background:rgba(255,255,255,.04); max-width:52vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .who b{color:#efe6d2; font-weight:600}

  .label{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:#7d7666; margin:16px 2px 8px}
  .houses{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
  .house{
    border:1px solid var(--line); background:rgba(255,255,255,.03); border-radius:16px;
    padding:14px 12px; font:inherit; color:#d9d2c2; text-align:left; cursor:pointer;
    display:flex; align-items:center; gap:10px; transition:transform .08s, border-color .15s, background .15s;
  }
  .house .gem{width:16px;height:16px;border-radius:4px;flex:0 0 auto; box-shadow:0 0 10px currentColor}
  .house .nm{font-size:16px; font-weight:700}
  .house.on{border-color:var(--gold); background:rgba(232,198,106,.10); color:#fff6e2; transform:translateY(-1px)}

  .numrow{display:flex; gap:10px; align-items:stretch}
  .sign{
    width:64px; border-radius:16px; border:1px solid var(--line); background:rgba(255,255,255,.04);
    color:#efe6d2; font:inherit; font-size:26px; font-weight:700; cursor:pointer;
  }
  .sign.neg{color:#ff8b7d; border-color:#5a2b2b; background:rgba(255,90,90,.08)}
  #pts{
    flex:1; min-width:0; border-radius:16px; border:1px solid var(--line); background:#100e1c;
    color:#fff6e2; font:inherit; font-size:34px; font-weight:700; text-align:center; padding:14px 8px;
    font-variant-numeric:lining-nums;
  }
  #pts:focus{outline:none; border-color:var(--gold-dim)}
  .chips{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
  .chip{border:1px solid var(--line); background:rgba(255,255,255,.03); color:#cfc8b8; border-radius:999px;
    padding:9px 14px; font:inherit; font-size:15px; cursor:pointer}
  .chip:active{background:rgba(232,198,106,.14)}

  #note{
    width:100%; border-radius:14px; border:1px solid var(--line); background:#100e1c; color:#e8e0cf;
    font:inherit; font-size:15px; padding:13px; margin-top:10px;
  }
  #note:focus{outline:none; border-color:var(--gold-dim)}

  .send{
    width:100%; margin-top:18px; border:none; border-radius:18px; padding:18px;
    font:inherit; font-size:19px; font-weight:800; color:#241503; cursor:pointer;
    background:linear-gradient(120deg,#ffd97a,#e0a52a); box-shadow:0 8px 22px -10px #e0a52a;
  }
  .send:disabled{opacity:.45; box-shadow:none}
  .hint{font-size:13px; color:#7d7666; text-align:center; margin-top:12px; line-height:1.45}

  /* potvrzení */
  .done{
    position:fixed; inset:0; background:rgba(6,7,15,.93); backdrop-filter:blur(3px);
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; z-index:9;
  }
  .done.show{display:flex}
  .done .big{font-size:44px; font-weight:800; letter-spacing:.02em}
  .done .sub{font-size:16px; color:#9a927f}
  .done .row{display:flex; gap:10px; margin-top:6px}
  .done button{font:inherit; font-size:16px; padding:13px 22px; border-radius:14px; cursor:pointer;
    border:1px solid var(--line); background:rgba(255,255,255,.05); color:#efe6d2}
  .done button.undo{color:#ffb4a8; border-color:#5a2b2b}
  .off{font-size:12.5px; color:#e0a06a; text-align:center; margin-top:8px; display:none}
  .off.show{display:block}

  /* jméno při prvním otevření */
  .ask{position:fixed; inset:0; background:rgba(6,7,15,.94); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; padding:22px; z-index:20}
  .ask.show{display:flex}
  .askbox{width:100%; max-width:380px; background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:22px}
  .askt{font-size:20px; font-weight:800; margin-bottom:6px}
  .asks{font-size:14px; color:#948c7c; line-height:1.45; margin-bottom:16px}
  #nameInput{width:100%; border-radius:14px; border:1px solid var(--line); background:#100e1c;
    color:#fff6e2; font:inherit; font-size:19px; padding:14px; text-align:center}
  #nameInput:focus{outline:none; border-color:var(--gold-dim)}
  #nameSave{width:100%; margin-top:12px; border:none; border-radius:14px; padding:15px;
    font:inherit; font-size:17px; font-weight:800; color:#241503; cursor:pointer;
    background:linear-gradient(120deg,#ffd97a,#e0a52a)}
</style>
</head>
<body>
<header>
  <div class="title">Školní pohár</div>
  <button class="who" id="who" title="změnit jméno">…</button>
</header>

<div class="label">Kolej</div>
<div class="houses" id="houses"></div>

<div class="label">Body</div>
<div class="numrow">
  <button class="sign" id="sign" title="znaménko">＋</button>
  <input id="pts" type="text" inputmode="numeric" autocomplete="off" placeholder="0" value="">
</div>
<div class="chips" id="chips">
  <button class="chip" data-v="5">+5</button>
  <button class="chip" data-v="10">+10</button>
  <button class="chip" data-v="20">+20</button>
  <button class="chip" data-v="-5">−5</button>
  <button class="chip" data-v="-10">−10</button>
  <button class="chip" data-v="-20">−20</button>
</div>

<input id="note" type="text" placeholder="Poznámka (nepovinné)" maxlength="200">

<button class="send" id="send" disabled>Zapsat</button>
<div class="hint" id="hint">Vyber kolej a napiš počet bodů. Kladné i záporné.</div>
<div class="off" id="off">📴 Bez signálu — zápis se odešle sám, jakmile bude internet.</div>

<div class="ask" id="ask">
  <div class="askbox">
    <div class="askt">Jak se jmenuješ?</div>
    <div class="asks">Jméno se objeví u každého zápisu a zůstane uložené v tomhle telefonu.</div>
    <input id="nameInput" type="text" maxlength="40" placeholder="Jana" autocomplete="off">
    <button id="nameSave">Pokračovat</button>
  </div>
</div>

<div class="done" id="done">
  <div class="big" id="doneBig">+10</div>
  <div class="sub" id="doneSub">Nebelvír</div>
  <div class="row">
    <button class="undo" id="undo">Vrátit</button>
    <button id="again">Další zápis</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var LS = window.localStorage;
  var qs = new URLSearchParams(location.search);
  var token = qs.get('k') || LS.getItem('pohar.k') || '';
  if (token) LS.setItem('pohar.k', token);
  // jméno lze předat i odkazem (?jmeno=Jana), pak ho telefon nemusí psát
  var name = qs.get('jmeno') || LS.getItem('pohar.jmeno') || '';
  if (qs.get('jmeno')) LS.setItem('pohar.jmeno', qs.get('jmeno'));

  var houses = [];
  var sel = null;
  var negative = false;
  var lastEvent = null;
  var lastTimer = null;

  var el = {
    houses: document.getElementById('houses'),
    pts: document.getElementById('pts'),
    sign: document.getElementById('sign'),
    note: document.getElementById('note'),
    send: document.getElementById('send'),
    who: document.getElementById('who'),
    hint: document.getElementById('hint'),
    done: document.getElementById('done'),
    doneBig: document.getElementById('doneBig'),
    doneSub: document.getElementById('doneSub'),
    off: document.getElementById('off')
  };

  if (!token) {
    document.body.innerHTML = '<div style="padding:40px 22px;font-family:system-ui;line-height:1.5;color:#efe6d2">' +
      '<h1 style="font-size:20px;margin-bottom:10px">Chybí odkaz</h1>' +
      '<p>Otevři prosím odkaz, který ti poslal Filip — je v něm klíč. Pak si stránku přidej na plochu.</p></div>';
    return;
  }

  // ---------------------------------------------------------------- jméno
  var ask = document.getElementById('ask');
  var nameInput = document.getElementById('nameInput');

  function askName() {
    nameInput.value = name || '';
    ask.classList.add('show');
    setTimeout(function () { nameInput.focus(); }, 60);
  }
  function saveName() {
    var n = (nameInput.value || '').trim().replace(/\s+/g, ' ').slice(0, 40);
    if (!n) { nameInput.focus(); return; }
    name = n;
    LS.setItem('pohar.jmeno', name);
    ask.classList.remove('show');
    paintWho();
    paint();
  }
  document.getElementById('nameSave').onclick = saveName;
  nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') saveName(); });
  function paintWho() {
    el.who.innerHTML = name ? 'Zapisuje <b>' + esc(name) + '</b>' : 'nastavit jméno';
  }
  el.who.onclick = askName;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  // ---------------------------------------------------------------- koleje
  fetch('/api/pohar/cfg').then(function (r) { return r.json(); }).then(function (j) {
    if (!j || !j.ok || !j.koleje) throw new Error('cfg');
    houses = j.koleje;
    el.houses.innerHTML = '';
    houses.forEach(function (h) {
      var b = document.createElement('button');
      b.className = 'house';
      b.dataset.id = h.id;
      b.innerHTML = '<span class="gem" style="background:' + esc(h.barva || '#888') + ';color:' + esc(h.barva || '#888') + '"></span>' +
                    '<span class="nm">' + esc(h.nazev) + '</span>';
      b.onclick = function () { sel = h; paint(); };
      el.houses.appendChild(b);
    });
    paint();
  }).catch(function () {
    el.hint.textContent = 'Konfiguraci se nepodařilo načíst — zkus obnovit stránku.';
  });

  // ---------------------------------------------------------------- čísla
  el.sign.onclick = function () {
    negative = !negative;
    el.sign.textContent = negative ? '－' : '＋';
    el.sign.classList.toggle('neg', negative);
    paint();
  };
  el.pts.addEventListener('input', function () {
    el.pts.value = el.pts.value.replace(/[^0-9]/g, '').slice(0, 4);
    paint();
  });
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
    c.onclick = function () {
      var v = Number(c.dataset.v);
      negative = v < 0;
      el.sign.textContent = negative ? '－' : '＋';
      el.sign.classList.toggle('neg', negative);
      el.pts.value = String(Math.abs(v));
      paint();
    };
  });

  function value() {
    var n = parseInt(el.pts.value || '0', 10) || 0;
    return negative ? -n : n;
  }

  function paint() {
    Array.prototype.forEach.call(el.houses.children, function (b) {
      b.classList.toggle('on', !!sel && b.dataset.id === sel.id);
    });
    var v = value();
    el.send.disabled = !(sel && v !== 0);
    el.send.textContent = sel && v !== 0
      ? 'Zapsat ' + sel.nazev + ' ' + (v > 0 ? '+' : '−') + Math.abs(v)
      : 'Zapsat';
  }

  // ---------------------------------------------------------------- odeslání
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  function payload() {
    return { k: token, jmeno: name, kolej: sel.id, body: value(), poznamka: el.note.value.trim(), eventId: uuid() };
  }

  function queue(p) {
    var q = JSON.parse(LS.getItem('pohar.q') || '[]');
    q.push(p); LS.setItem('pohar.q', JSON.stringify(q));
    el.off.classList.add('show');
  }

  function flush() {
    var q = JSON.parse(LS.getItem('pohar.q') || '[]');
    if (!q.length) { el.off.classList.remove('show'); return; }
    var p = q[0];
    send(p, function (ok) {
      if (ok) { q.shift(); LS.setItem('pohar.q', JSON.stringify(q)); if (q.length) flush(); else el.off.classList.remove('show'); }
    });
  }

  function send(p, cb) {
    fetch('/api/pohar/body', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(p)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.ok) {
        cb && cb(true, j);
        return;
      }
      el.hint.textContent = (j && j.error) || 'Zápis se nepovedl.';
      cb && cb(false, j);
    }).catch(function () {
      cb && cb(false);
    });
  }

  el.send.onclick = function () {
    if (!name) { askName(); return; }
    var v = value();
    if (!sel || !v) return;
    var p = payload();
    el.send.disabled = true;
    send(p, function (ok, j) {
      if (ok) {
        showDone(v, sel.nazev, p);
        el.note.value = '';
        el.pts.value = '';
        negative = false; el.sign.textContent = '＋'; el.sign.classList.remove('neg');
      } else if (j === undefined) {
        queue(p);
        el.note.value = ''; el.pts.value = '';
        showDone(v, sel.nazev, p, true);
      }
      paint();
    });
  };

  var queueTimer = setInterval(flush, 20000);
  window.addEventListener('online', flush);

  // ---------------------------------------------------------------- potvrzení
  function showDone(v, houseName, p, queued) {
    lastEvent = { id: p.eventId, v: v, house: houseName };
    el.doneBig.textContent = (v > 0 ? '+' : '−') + Math.abs(v);
    el.doneBig.style.color = v > 0 ? '#8ce0a0' : '#ff9a8a';
    el.doneSub.textContent = houseName + (queued ? ' · odešle se později' : '');
    el.done.classList.add('show');
    clearTimeout(lastTimer);
    lastTimer = setTimeout(function () { el.done.classList.remove('show'); }, 6000);
    if (navigator.vibrate) navigator.vibrate(v > 0 ? 30 : [20, 40, 20]);
  }

  document.getElementById('again').onclick = function () { el.done.classList.remove('show'); };
  document.getElementById('undo').onclick = function () {
    if (!lastEvent) return;
    el.done.classList.remove('show');
    fetch('/api/pohar/undo', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ k: token, jmeno: name, eventId: lastEvent.id })
    }).then(function (r) { return r.json(); }).then(function (j) {
      el.hint.textContent = (j && j.ok) ? 'Vráceno.' : ((j && j.error) || 'Vrátit se nepovedlo.');
    }).catch(function () { el.hint.textContent = 'Vrátit se nepovedlo — bez signálu.'; });
  };

  // ---------------------------------------------------------------- start
  paintWho();
  if (!name) setTimeout(askName, 300);
  paint();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
