<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0a14">
<title>Zápis bodů — Školní pohár</title>
<link rel="manifest" href="manifest-zapis.webmanifest">
<link rel="icon" href="/icon-192.png">
<style>
  :root{ --gold:#e8c66a; --gold-dim:#a8863c; --card:#161327; --line:#2a2440; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
    font-family:'Trebuchet MS',system-ui,sans-serif; color:#efe6d2;
    background:radial-gradient(120% 70% at 50% -10%, #1b2340 0%, #0d1020 48%, #06070f 100%);
    padding:14px 14px calc(18px + env(safe-area-inset-bottom));
  }
  header{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
  .title{font-size:15px; letter-spacing:.16em; text-transform:uppercase;
    background:linear-gradient(180deg,#fff3cc,#e8c66a 60%,#9c7a2e);
    -webkit-background-clip:text; background-clip:text; color:transparent}
  .who{font-size:13px; color:#9a927f; border:1px solid var(--line); border-radius:999px; padding:6px 11px;
    background:rgba(255,255,255,.04); max-width:52vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .who b{color:#efe6d2; font-weight:600}

  .label{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:#7d7666; margin:16px 2px 8px}
  .houses{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
  .house{
    border:1px solid var(--line); background:rgba(255,255,255,.03); border-radius:16px;
    padding:14px 12px; font:inherit; color:#d9d2c2; text-align:left; cursor:pointer;
    display:flex; align-items:center; gap:10px; transition:transform .08s, border-color .15s, background .15s;
  }
  .house .gem{width:16px;height:16px;border-radius:4px;flex:0 0 auto; box-shadow:0 0 10px currentColor}
  .house .nm{font-size:16px; font-weight:700}
  .house.on{border-color:var(--gold); background:rgba(232,198,106,.10); color:#fff6e2; transform:translateY(-1px)}

  .numrow{display:flex; gap:10px; align-items:stretch}
  .sign{
    width:64px; border-radius:16px; border:1px solid var(--line); background:rgba(255,255,255,.04);
    color:#efe6d2; font:inherit; font-size:26px; font-weight:700; cursor:pointer;
  }
  .sign.neg{color:#ff8b7d; border-color:#5a2b2b; background:rgba(255,90,90,.08)}
  #pts{
    flex:1; min-width:0; border-radius:16px; border:1px solid var(--line); background:#100e1c;
    color:#fff6e2; font:inherit; font-size:34px; font-weight:700; text-align:center; padding:14px 8px;
    font-variant-numeric:lining-nums;
  }
  #pts:focus{outline:none; border-color:var(--gold-dim)}
  .chips{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
  .chip{border:1px solid var(--line); background:rgba(255,255,255,.03); color:#cfc8b8; border-radius:999px;
    padding:9px 14px; font:inherit; font-size:15px; cursor:pointer}
  .chip:active{background:rgba(232,198,106,.14)}

  #note{
    width:100%; border-radius:14px; border:1px solid var(--line); background:#100e1c; color:#e8e0cf;
    font:inherit; font-size:15px; padding:13px; margin-top:10px;
  }
  #note:focus{outline:none; border-color:var(--gold-dim)}

  .send{
    width:100%; margin-top:18px; border:none; border-radius:18px; padding:18px;
    font:inherit; font-size:19px; font-weight:800; color:#241503; cursor:pointer;
    background:linear-gradient(120deg,#ffd97a,#e0a52a); box-shadow:0 8px 22px -10px #e0a52a;
  }
  .send:disabled{opacity:.45; box-shadow:none}
  /* při odesílání tlačítko pulzuje, ať je vidět, že se něco děje */
  .send.sending{opacity:1; animation:sendpulse 1s ease-in-out infinite}
  @keyframes sendpulse{
    0%,100%{ box-shadow:0 8px 22px -10px #e0a52a }
    50%{ box-shadow:0 0 0 .7vh rgba(232,198,106,.28) }
  }
  .hint{font-size:13px; color:#7d7666; text-align:center; margin-top:12px; line-height:1.45}

  /* moje zápisy — vlastní scroll, aby tlačítka zůstala nahoře */
  .histwrap{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; margin-top:16px}
  .histhead{display:flex; justify-content:space-between; align-items:baseline;
    font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:#7d7666; margin:0 2px 6px}
  .histhead b{color:#cfc8b8; font-weight:600; letter-spacing:0}
  .hist{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    border-top:1px solid var(--line); padding-top:6px}
  .hrow{display:flex; align-items:center; gap:9px; padding:8px 4px; border-bottom:1px solid rgba(255,255,255,.05); font-size:14px}
  .hrow .dot{width:10px; height:10px; border-radius:3px; flex:0 0 auto}
  .hrow .nm{flex:1 1 auto; color:#d9d2c2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hrow .pt{font-weight:800; font-variant-numeric:tabular-nums; min-width:5ch; text-align:right}
  .hrow .pt.plus{color:#8ce0a0}
  .hrow .pt.minus{color:#ff9a8a}
  .hrow .tm{color:#6f6959; font-size:12px; white-space:nowrap; text-align:right; flex:0 0 auto}
  .hrow.rev{opacity:.45}
  .hrow.rev .pt{text-decoration:line-through}
  .hempty{color:#6f6959; font-size:13.5px; text-align:center; padding:18px 0}

  /* potvrzení */
  .done{
    position:fixed; inset:0; background:rgba(6,7,15,.93); backdrop-filter:blur(3px);
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; z-index:9;
  }
  .done.show{display:flex}
  .done .big{font-size:44px; font-weight:800; letter-spacing:.02em}
  .done .sub{font-size:16px; color:#9a927f; text-align:center; line-height:1.45}
  .done .row{display:flex; gap:10px; margin-top:6px}
  /* „čekejte" musí být vidět na první pohled a na vlastním řádku */
  .done .wait{margin-top:12px; font-size:20px; font-weight:800; letter-spacing:.06em; color:#ffd97a;
    text-align:center; animation:waitpulse 1.1s ease-in-out infinite}
  @keyframes waitpulse{ 0%,100%{opacity:.55} 50%{opacity:1} }
  .done button{font:inherit; font-size:16px; padding:13px 22px; border-radius:14px; cursor:pointer;
    border:1px solid var(--line); background:rgba(255,255,255,.05); color:#efe6d2}
  .done button.undo{color:#ffb4a8; border-color:#5a2b2b}
  .off{font-size:12.5px; color:#e0a06a; text-align:center; margin-top:8px; display:none}
  .off.show{display:block}

  /* chybová zpráva, ať je vidět, proč se zápis nepovedl */
  .msg{display:none; margin-top:12px; padding:12px 14px; border-radius:14px; font-size:14.5px; line-height:1.45;
    background:rgba(224,60,60,.12); border:1px solid rgba(224,60,60,.45); color:#ffc9c1}
  .msg.show{display:block}
  .msg b{color:#fff}

  /* jméno při prvním otevření */
  .ask{position:fixed; inset:0; background:rgba(6,7,15,.94); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; padding:22px; z-index:20}
  .ask.show{display:flex}
  .askbox{width:100%; max-width:380px; background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:22px}
  .askt{font-size:20px; font-weight:800; margin-bottom:6px}
  .asks{font-size:14px; color:#948c7c; line-height:1.45; margin-bottom:16px}
  #nameInput{width:100%; border-radius:14px; border:1px solid var(--line); background:#100e1c;
    color:#fff6e2; font:inherit; font-size:19px; padding:14px; text-align:center}
  #nameInput:focus{outline:none; border-color:var(--gold-dim)}
  #nameSave{width:100%; margin-top:12px; border:none; border-radius:14px; padding:15px;
    font:inherit; font-size:17px; font-weight:800; color:#241503; cursor:pointer;
    background:linear-gradient(120deg,#ffd97a,#e0a52a)}
</style>
</head>
<body>
<header>
  <div class="title">Školní pohár</div>
  <button class="who" id="who" title="změnit jméno">…</button>
</header>

<div class="form">
<div class="label">Kolej</div>
<div class="houses" id="houses"></div>

<div class="label">Body</div>
<div class="numrow">
  <button class="sign" id="sign" title="znaménko">＋</button>
  <input id="pts" type="text" inputmode="numeric" autocomplete="off" placeholder="0" value="">
</div>

<input id="note" type="text" placeholder="Poznámka (nepovinná)" maxlength="200">

<button class="send" id="send" disabled>Zapsat</button>
<div class="msg" id="msg"></div>
<div class="hint" id="hint">Vyber kolej a napiš počet bodů. Tlačítkem ＋/－ přepneš znaménko.</div>
<div class="off" id="off">📴 Bez signálu — zápis se odešle sám, jakmile bude internet.</div>
</div>

<div class="histwrap">
  <div class="histhead"><span>Moje zápisy</span><b id="histWho" style="display:none"></b></div>
  <div class="hist" id="hist"></div>
</div>

<div class="ask" id="ask">
  <div class="askbox">
    <div class="askt">Jak se jmenuješ?</div>
    <div class="asks">Jméno se objeví u každého zápisu a zůstane uložené v tomhle telefonu.</div>
    <input id="nameInput" type="text" maxlength="40" placeholder="Jana" autocomplete="off">
    <button id="nameSave">Pokračovat</button>
  </div>
</div>

<div class="done" id="done">
  <div class="big" id="doneBig">+10</div>
  <div class="sub" id="doneSub">Nebelvír</div>
  <div class="row">
    <button class="undo" id="undo">Vrátit</button>
    <button id="again">Další zápis</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var LS = window.localStorage;
  var qs = new URLSearchParams(location.search);
  var token = qs.get('k') || LS.getItem('pohar.k') || '';
  if (token) LS.setItem('pohar.k', token);
  // jméno lze předat i odkazem (?jmeno=Jana), pak ho telefon nemusí psát
  var name = qs.get('jmeno') || LS.getItem('pohar.jmeno') || '';
  if (qs.get('jmeno')) LS.setItem('pohar.jmeno', qs.get('jmeno'));

  var houses = [];
  var sel = {};            // id → true (jde vybrat i víc kolejí naráz)
  var lastEvents = [];     // eventId posledního zápisu (pro „Vrátit")
  var lastTimer = null;

  var el = {
    houses: document.getElementById('houses'),
    pts: document.getElementById('pts'),
    sign: document.getElementById('sign'),
    note: document.getElementById('note'),
    send: document.getElementById('send'),
    who: document.getElementById('who'),
    hint: document.getElementById('hint'),
    done: document.getElementById('done'),
    doneBig: document.getElementById('doneBig'),
    doneSub: document.getElementById('doneSub'),
    off: document.getElementById('off')
  };

  if (!token) {
    document.body.innerHTML = '<div style="padding:40px 22px;font-family:system-ui;line-height:1.5;color:#efe6d2">' +
      '<h1 style="font-size:20px;margin-bottom:10px">Chybí odkaz</h1>' +
      '<p>Otevři prosím odkaz, který ti poslal Filip — je v něm klíč. Pak si stránku přidej na plochu.</p></div>';
    return;
  }

  // ---------------------------------------------------------------- jméno
  var ask = document.getElementById('ask');
  var nameInput = document.getElementById('nameInput');

  function askName() {
    nameInput.value = name || '';
    ask.classList.add('show');
    setTimeout(function () { nameInput.focus(); }, 60);
  }
  function saveName() {
    var n = (nameInput.value || '').trim().replace(/\s+/g, ' ').slice(0, 40);
    if (!n) { nameInput.focus(); return; }
    name = n;
    LS.setItem('pohar.jmeno', name);
    ask.classList.remove('show');
    paintWho();
    paint();
  }
  document.getElementById('nameSave').onclick = saveName;
  nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') saveName(); });
  function paintWho() {
    el.who.innerHTML = name ? 'Zapisuje <b>' + esc(name) + '</b>' : 'nastavit jméno';
  }
  el.who.onclick = askName;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  // ---------------------------------------------------------------- koleje
  fetch('/api/pohar/cfg').then(function (r) { return r.json(); }).then(function (j) {
    if (!j || !j.ok || !j.koleje) throw new Error('cfg');
    houses = j.koleje;
    el.houses.innerHTML = '';
    houses.forEach(function (h) {
      var b = document.createElement('button');
      b.className = 'house';
      b.dataset.id = h.id;
      b.innerHTML = '<span class="gem" style="background:' + esc(h.barva || '#888') + ';color:' + esc(h.barva || '#888') + '"></span>' +
                    '<span class="nm">' + esc(h.nazev) + '</span>';
      b.onclick = function () { sel[h.id] = !sel[h.id]; paint(); };
      el.houses.appendChild(b);
    });
    paint();
    renderHist(false);
  }).catch(function () {
    el.hint.textContent = 'Konfiguraci se nepodařilo načíst — zkus obnovit stránku.';
  });

  // ---------------------------------------------------------------- čísla
  // mínus lze napsat i z klávesnice („-30"), tlačítko ＋/－ ho jen přepíná
  function syncSign() {
    var neg = el.pts.value.charAt(0) === '-';
    el.sign.textContent = neg ? '－' : '＋';
    el.sign.classList.toggle('neg', neg);
  }
  el.sign.onclick = function () {
    var v = el.pts.value;
    el.pts.value = v.charAt(0) === '-' ? v.slice(1) : '-' + v;
    syncSign();
    paint();
  };
  el.pts.addEventListener('input', function () {
    var raw = el.pts.value;
    var neg = raw.charAt(0) === '-';
    var digits = raw.replace(/[^0-9]/g, '').slice(0, 4);
    el.pts.value = (neg ? '-' : '') + digits;
    syncSign();
    paint();
  });
  function value() {
    var n = parseInt(el.pts.value || '0', 10);
    return isNaN(n) ? 0 : n;
  }

  function selectedIds() {
    var out = [];
    houses.forEach(function (h) { if (sel[h.id]) out.push(h.id); });
    return out;
  }
  function namesFor(ids) {
    return ids.map(function (id) {
      for (var i = 0; i < houses.length; i++) if (houses[i].id === id) return houses[i].nazev;
      return id;
    });
  }

  function paint() {
    Array.prototype.forEach.call(el.houses.children, function (b) {
      b.classList.toggle('on', !!sel[b.dataset.id]);
    });
    var ids = selectedIds(), v = value();
    el.send.disabled = !(ids.length && v !== 0);
    if (!ids.length || v === 0) {
      el.send.textContent = 'Zapsat';
    } else if (ids.length === 1) {
      el.send.textContent = 'Zapsat ' + namesFor(ids)[0] + ' ' + (v > 0 ? '+' : '−') + Math.abs(v);
    } else {
      el.send.textContent = 'Zapsat ' + (v > 0 ? '+' : '−') + Math.abs(v) + ' do ' + ids.length + ' kolejí';
    }
  }

  // ---------------------------------------------------------------- odeslání
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }


  function queue(p) {
    var q = JSON.parse(LS.getItem('pohar.q') || '[]');
    q.push(p); LS.setItem('pohar.q', JSON.stringify(q));
    el.off.classList.add('show');
  }

  function flush() {
    var q = JSON.parse(LS.getItem('pohar.q') || '[]');
    if (!q.length) { el.off.classList.remove('show'); return; }
    var p = q[0];
    send(p, function (ok) {
      if (ok) { q.shift(); LS.setItem('pohar.q', JSON.stringify(q)); if (q.length) flush(); else el.off.classList.remove('show'); }
    });
  }

  function showMsg(text) {
    var el2 = document.getElementById('msg');
    el2.innerHTML = text;
    el2.classList.add('show');
  }
  function clearMsg() {
    var el2 = document.getElementById('msg');
    el2.classList.remove('show');
    el2.innerHTML = '';
  }
  // server vrací technické hlášky — tady se překládají do řeči, které jde rozumět
  function friendly(j) {
    var e = String((j && j.error) || '');
    if (e.indexOf('neznámý odkaz') >= 0) {
      return '<b>Aplikace ještě není propojená s tabulkou.</b> Chybí nová verze skriptu v Apps Scriptu — ozvi se Filipovi, sám to neopravíš.';
    }
    if (e.indexOf('příliš rychle') >= 0) return 'Počkej prosím 2 sekundy mezi zápisy.';
    if (e.indexOf('neznámá kolej') >= 0) return 'Tuhle kolej tabulka nezná — obnov stránku.';
    if (e.indexOf('celé číslo') >= 0) return 'Zadej celé číslo (bez desetinné čárky), nejvýš ±500.';
    if (e.indexOf('špatný klíč') >= 0) return '<b>Špatné nastavení serveru</b> — ozvi se Filipovi.';
    return e ? ('Zápis se nepovedl: ' + e) : 'Zápis se nepovedl, zkus to znovu.';
  }

  function send(p, cb) {
    fetch('/api/pohar/body', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(p)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.ok) {
        cb && cb(true, j);
        return;
      }
      showMsg(friendly(j));
      cb && cb(false, j);
    }).catch(function () {
      cb && cb(false);
    });
  }

  el.send.onclick = function () {
    if (!name) { askName(); return; }
    var v = value();
    var ids = selectedIds();
    if (!ids.length || !v) return;

    var note = el.note.value.trim();
    var names = namesFor(ids);
    var todo = ids.map(function (id) {
      return { k: token, jmeno: name, kolej: id, body: v, poznamka: note, eventId: uuid() };
    });

    el.send.disabled = true;
    el.send.classList.add('sending');
    el.send.textContent = 'Zapisuju…';
    clearMsg();
    showDone(v, names, [], [], true);
    setProgress(0, todo.length);

    var done = [], queued = [], failed = 0, i = 0, tries = 0;

    function setProgress(k, n) {
      var w = el.done.querySelector('.wait');
      if (!w) return;
      w.textContent = n > 1 ? '⏳ Čekejte… ' + k + ' z ' + n : '⏳ Čekejte…';
    }

    function finish() {
      el.send.classList.remove('sending');
      el.note.value = '';
      el.pts.value = '';
      syncSign();
      sel = {};
      paint();
      if (failed) { el.done.classList.remove('show'); return; }
      showDone(v, names, done, queued, false);
    }

    // zápisy jdou jeden po druhém: skript pouští jen jeden za 2 s a souběžné
    // požadavky se jinak tiše zahazují — proto se u čtyř kolejí čeká 4×
    function step() {
      if (i >= todo.length) { finish(); return; }
      var item = todo[i];
      send(item, function (ok, j) {
        if (!ok && j && /příliš rychle/.test(String(j.error || '')) && tries < 4) {
          tries++;
          setTimeout(step, 2400);
          return;
        }
        tries = 0;
        if (ok) {
          done.push(item);
          histAdd({ id: item.eventId, t: Date.now(), kolej: item.kolej, body: item.body, poznamka: item.poznamka });
          clearMsg();
        } else if (j === undefined) {
          queue(item); queued.push(item);
        } else {
          failed++; showMsg(friendly(j));
        }
        i++;
        setProgress(i, todo.length);
        step();
      });
    }

    step();
  };

  var queueTimer = setInterval(flush, 20000);
  window.addEventListener('online', flush);

  // ---------------------------------------------------------------- potvrzení
  function showDone(v, names, done, queued, pending) {
    if (!pending) lastEvents = (done || []).map(function (p) { return p.eventId; });
    el.doneBig.textContent = (v > 0 ? '+' : '−') + Math.abs(v);
    el.doneBig.style.color = v > 0 ? '#8ce0a0' : '#ff9a8a';
    var sub = (names || []).join(' · ');
    if (pending) {
      el.doneSub.innerHTML = esc(sub) + '<div class="wait">⏳ Čekejte…</div>';
    } else {
      if (queued && queued.length) sub += ' · odešle se později';
      else sub += ' · zapsáno';
      el.doneSub.textContent = sub;
    }
    // dokud nepřijde odpověď, tlačítka nejsou vidět — jinak to vypadá, že se vrací stará karta
    var vis = pending ? 'hidden' : 'visible';
    document.getElementById('undo').style.visibility = vis;
    document.getElementById('again').style.visibility = vis;
    el.done.classList.add('show');
    clearTimeout(lastTimer);
    lastTimer = setTimeout(function () { el.done.classList.remove('show'); }, pending ? 60000 : 7000);
    if (!pending && navigator.vibrate) navigator.vibrate(v > 0 ? 30 : [20, 40, 20]);
  }

  document.getElementById('again').onclick = function () { el.done.classList.remove('show'); };
  document.getElementById('undo').onclick = function () {
    if (!lastEvents.length) return;
    el.done.classList.remove('show');
    var ids = lastEvents.slice();
    lastEvents = [];
    ids.forEach(histRevoke);
    var left = ids.length, problems = 0;
    ids.forEach(function (id) {
      fetch('/api/pohar/undo', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ k: token, jmeno: name, eventId: id })
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (!(j && j.ok)) problems++;
      }).catch(function () { problems++; }).then(function () {
        if (--left === 0) {
          el.hint.textContent = problems ? 'Část vrácení se nepovedla — zkontroluj tabulku.' : 'Vráceno.';
        }
      });
    });
  };

  // ---------------------------------------------------------------- moje zápisy
  var HIST_KEY = 'pohar.hist';

  function histLoad() {
    try { return JSON.parse(LS.getItem(HIST_KEY) || '[]'); } catch (e) { return []; }
  }
  function histSave(list) { LS.setItem(HIST_KEY, JSON.stringify(list.slice(0, 200))); }

  function histAdd(entry) {
    var list = histLoad();
    for (var i = 0; i < list.length; i++) if (list[i].id === entry.id) return;
    list.unshift(entry);
    histSave(list);
    renderHist(true);
  }
  function histRevoke(id) {
    var list = histLoad();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) list[i].rev = true;
    histSave(list);
    renderHist(false);
  }
  function houseOf(id) {
    for (var i = 0; i < houses.length; i++) if (houses[i].id === id) return houses[i];
    return null;
  }
  function fmtTime(ts) {
    var d = new Date(ts), now = new Date();
    var hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    if (d.toDateString() === now.toDateString()) return hm;
    return d.getDate() + '.' + (d.getMonth() + 1) + '. ' + hm;
  }
  function renderHist(scrollTop) {
    var box = document.getElementById('hist');
    var who = document.getElementById('histWho');
    if (who) who.textContent = name || '';
    var list = histLoad();
    if (!list.length) {
      box.innerHTML = '<div class="hempty">Zatím žádný zápis. Až nějaký uděláš, objeví se tady.</div>';
      return;
    }
    var html = '';
    list.forEach(function (e) {
      var h = houseOf(e.kolej);
      html += '<div class="hrow' + (e.rev ? ' rev' : '') + '">' +
        '<span class="dot" style="background:' + esc(h ? h.barva : '#888') + '"></span>' +
        '<span class="nm">' + esc(h ? h.nazev : e.kolej) + (e.poznamka ? ' · ' + esc(e.poznamka) : '') + '</span>' +
        '<span class="pt ' + (e.body > 0 ? 'plus' : 'minus') + '">' + (e.body > 0 ? '+' : '−') + Math.abs(e.body) + '</span>' +
        '<span class="tm">' + fmtTime(e.t) + '</span>' +
        '</div>';
    });
    box.innerHTML = html;
    if (scrollTop) box.scrollTop = 0;
  }

  // ---------------------------------------------------------------- start
  paintWho();
  renderHist(false);
  if (!name) setTimeout(askName, 300);
  paint();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
