<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"><title>demo</title>
<link rel="stylesheet" href="styles.css"></head>
<body>
<main id="app"></main>
<script>
  const v = new URLSearchParams(location.search).get('v') || 'board';
  const teams = [
    { id: 't1', name: 'Nováci', players: ['Petr', 'Jana'], score: 120000, p: 0 },
    { id: 't2', name: 'Veteráni', players: [], score: 80000, p: 0 },
    { id: 't3', name: 'Perličky', players: ['Karel'], score: 40000, p: 0 }
  ];
  const used = {
    q0: { owner: 't1', stolen: false },
    q6: { owner: 't2', stolen: true },
    q12: { owner: null, stolen: false },
    q20: { owner: 't3', stolen: false }
  };
  const cur = {
    qid: v === 'reveal' ? 'q12' : 'q18',
    phase: v === 'reveal' ? 'done' : 'ask',
    respondIdx: 1,
    tried: [1],
    result: v === 'reveal' ? { teamId: 't1', pts: 30000, stolen: true } : null
  };
  localStorage.setItem('perlicky-v1', JSON.stringify({
    teams, used, turn: 1, limit: 30,
    view: v, current: (v === 'question' || v === 'reveal') ? cur : null
  }));
</script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
  setTimeout(() => {
    const over = document.documentElement.scrollHeight - window.innerHeight;
    document.title = (over > 0 ? 'OVERFLOW+' + over : 'FITS ' + window.innerHeight);
  }, 300);
</script>
</body></html>
