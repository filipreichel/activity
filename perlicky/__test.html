<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"><title>test</title>
<link rel="stylesheet" href="styles.css"></head>
<body>
<main id="app"></main>
<pre id="out" style="white-space:pre-wrap;font:12px monospace"></pre>
<script>
  window.confirm = () => true;
  window.addEventListener('error', e => { window.__err = (window.__err || '') + 'JS ERROR: ' + e.message + '\n'; });
</script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
/* Regresní test řídicího okna a projekce.
   Skutečné propojení dvou oken ověřuje CDP skript (viz AGENTS.md v repu). */

const IS_DISPLAY_TEST = new URLSearchParams(location.search).get('role') === 'display';
const norm = s => String(s == null ? '' : s).replace(/[\u00a0\u202f]/g, ' ').replace(/\s+/g, ' ').trim();
const q = sel => document.querySelector(sel);
const qa = sel => Array.from(document.querySelectorAll(sel));
const txt = sel => { const el = q(sel); return el ? norm(el.textContent) : '—'; };
function click(sel) {
  const el = q(sel);
  if (!el) throw new Error('chybí prvek: ' + sel);
  el.click();
}
function setInput(sel, val) {
  const el = q(sel);
  if (!el) throw new Error('chybí input: ' + sel);
  el.value = val;
  el.dispatchEvent(new Event('input', { bubbles: true }));
}
const T = [];
function check(name, cond, detail) {
  T.push((cond ? 'OK  ' : 'FAIL') + ' | ' + name + (detail !== undefined ? ' | ' + norm(detail) : ''));
}
const scores = () => qa('.team-chip .score').map(e => norm(e.textContent));

function finish() {
  const failed = T.filter(x => x.startsWith('FAIL')).length;
  const err = window.__err ? '\n' + window.__err : '';
  document.getElementById('out').textContent =
    T.join('\n') + err + '\n\n' + (failed ? 'FAILŮ: ' + failed + ' z ' + T.length : 'VŠE OK (' + T.length + ' kontrol)');
  document.title = failed ? 'FAIL-' + failed : 'PASS-' + T.length;
}

/* ============ projekce ============ */

function displayTests() {
  const teams = [
    { id: 't1', name: 'Nováci', players: ['Petr', 'Jana'], score: 3000, p: 0 },
    { id: 't2', name: 'Veteráni', players: [], score: -500, p: 0 }
  ];
  const send = (view, current, extra) => applyRemote(Object.assign(
    { teams, used: {}, turn: 0, limit: 30, view, current: current || null, timeLeft: 12 }, extra || {}));

  check('čeká na řídicí okno', q('.waiting') !== null);

  send('board');
  check('plán se vykreslí', qa('.tile').length === 25, qa('.tile').length);
  check('plán: dlaždice nejdou klikat', q('[data-act="open"]') === null);
  check('plán: bez ovládání hry', q('[data-act="undo"]') === null && q('[data-act="new-game"]') === null);
  check('plán: skóre vidět', scores().join(' / ') === '3 000 / -500', scores().join(' / '));
  check('plán: bez vysvětlujících popisků', txt('.board-foot') === '—' || !txt('.board-foot').includes('učitel'));
  check('plán: tlačítko celé obrazovky', q('[data-act="fullscreen"]') !== null);

  const picked = { qid: 'q19', phase: 'picked', respondIdx: 0, askerIdx: 0, offerIdx: null, stealUsed: false, stealLimit: 15, result: null };
  send('board', picked);
  check('vybráno: dlaždice zvýrazněná', qa('.tile.picked').length === 1);
  check('vybráno: banner s kategorií', txt('.picked-banner').includes('Vybraná otázka') && txt('.picked-banner').includes('5 000'), txt('.picked-banner'));
  check('vybráno: otázka ještě není vidět', q('.options') === null);

  const ask = Object.assign({}, picked, { phase: 'ask' });
  send('question', ask);
  check('otázka: nejdřív bez odpovědí', qa('.options li').length === 0 && q('.solo-text') !== null);
  check('otázka: bez odpočtu', q('.tnum') === null);

  send('question', Object.assign({}, picked, { phase: 'play' }));
  check('odpovědi: varianty vidět', qa('.options li').length === 5, qa('.options li').length);
  check('otázka: správná odpověď SKRYTÁ', qa('.options li.right').length === 0);
  check('otázka: bez panelu pro učitele', q('.teacher') === null);
  check('otázka: bez tlačítek Věděl/Nevěděl', q('[data-act="right"]') === null && q('[data-act="wrong"]') === null);
  check('otázka: časomíra z řídicího okna', txt('.tnum') === '12', txt('.tnum'));
  check('otázka: jména hráčů vidět', txt('.turnbox .who').includes('Petr') && txt('.turnbox .who').includes('Jana'), txt('.turnbox .who'));

  send('question', Object.assign({}, ask, { phase: 'offer', offerIdx: 1 }));
  check('krádež: dialog s podmínkami', q('.steal-dialog') !== null);
  check('krádež: správně = +polovina', txt('.sd-terms li').includes('+2 500'), txt('.sd-terms'));
  check('krádež: špatně = -polovina', txt('.sd-terms').includes('−2 500'), txt('.sd-terms'));
  check('krádež: čas v dialogu', txt('.sd-terms').includes('15 s'), txt('.sd-terms'));
  check('krádež: bez tlačítek na projekci', q('[data-act="steal-yes"]') === null);

  send('reveal', Object.assign({}, ask, { phase: 'done', result: { teamId: 't1', pts: 2500, stolen: true } }));
  check('odhalení: odpověď vidět', txt('.answer-line').includes('Suchdol'), txt('.answer-line'));
  check('odhalení: kdo dostal body', txt('.award').includes('Nováci'), txt('.award'));
  check('odhalení: správná varianta zeleně', qa('.options li.right').length === 1);
  check('odhalení: bez tlačítka Pokračovat', q('[data-act="next"]') === null);

  send('results', null, { used: {} });
  check('výsledky: stupně vítězů', qa('.podium-step').length === 2, qa('.podium-step').length);
  check('výsledky: bez tlačítek', q('[data-act="new-game"]') === null);

  check('projekce nezapisuje stav', localStorage.getItem('perlicky-v1') === null);
  finish();
}

/* ============ řídicí okno ============ */

function controlTests() {
  localStorage.removeItem('perlicky-v1');

  /* 1. nastavení, osm týmů */
  check('úvodní obrazovka', q('.setup') !== null);
  for (let i = 0; i < 10; i++) {
    const btn = q('[data-act="add-team"]');
    if (!btn || btn.disabled) break;
    btn.click();
  }
  check('max 8 týmů', qa('[data-team-name]').length === 8, qa('[data-team-name]').length);
  while (qa('[data-team-name]').length > 3) {
    qa('[data-act="del-team"]').filter(b => !b.disabled).pop().click();
  }
  const ids = qa('[data-team-name]').map(e => e.dataset.teamName);
  setInput('[data-team-name="' + ids[0] + '"]', 'Nováci');
  setInput('[data-team-players="' + ids[0] + '"]', 'Petr, Jana');
  setInput('[data-team-name="' + ids[1] + '"]', 'Veteráni');
  setInput('[data-team-name="' + ids[2] + '"]', 'Perličky');
  setInput('[data-team-players="' + ids[2] + '"]', 'Karel');

  click('[data-limit="20"]');
  click('[data-act="start"]');

  /* 2. plán: jen názvy týmů, jména až v „na řadě“ */
  check('plán: 25 dlaždic', qa('.tile').length === 25, qa('.tile').length);
  const vals = qa('.tile').map(t => norm(t.textContent));
  check('body 1 000–5 000', new Set(vals).size === 5 && vals[0] === '1 000' && vals[5] === '2 000' && vals[20] === '5 000');
  check('skóre: jen název týmu', qa('.team-chip .who').length === 0 && txt('.team-chip .name') === 'Nováci');
  check('na řadě: tým — všichni hráči', txt('.turn-banner b') === 'Nováci — Petr, Jana', txt('.turn-banner b'));

  /* 3. první klik jen vybere, druhý ukáže */
  const first = qa('.tile')[0];
  first.click();
  check('1. klik: dlaždice označená', qa('.tile.picked').length === 1);
  check('1. klik: otázka se ještě neukáže', q('.options') === null && q('.qtext') === null);
  check('1. klik: banner vybrané otázky', txt('.picked-banner').includes('Vybraná otázka'), txt('.picked-banner'));
  check('1. klik: tlačítko Zobrazit otázku', q('[data-act="show"]') !== null);

  click('[data-act="show"]');
  check('2. klik: otázka se ukáže', q('.solo-text') !== null, txt('.solo-text').slice(0, 40));
  check('2. klik: bez odpovědí a bez odpočtu', q('.options') === null && q('.tnum') === null && timerHandle === null);
  check('2. klik: tlačítko Zobrazit odpovědi', q('[data-act="options"]') !== null);
  click('[data-act="options"]');
  check('3. klik: odpovědi vidět', qa('.options li').length === 3 && q('.tnum') !== null);
  check('3. klik: odpočet běží', timerHandle !== null);
  check('řídicí okno: správná varianta zvýrazněná', qa('.options li.right').length === 1);
  check('řídicí okno: panel pro učitele dole', q('.teacher') !== null);
  check('panel pro učitele je až za otázkou',
    q('.qbody').compareDocumentPosition(q('.teacher')) === Node.DOCUMENT_POSITION_FOLLOWING);

  /* 3b. přepínač odpovědí, oko a zvuk nesmí zastavit odpočet */
  check('odpočet běží', timerHandle !== null);
  click('[data-act="sound"]');
  check('změna hlasitosti nezastaví odpočet', timerHandle !== null);
  click('[data-act="sound"]');
  click('[data-act="sound"]');   // zpět na tiše

  click('[data-act="answers"]');
  check('přepínač: odpověď skrytá u všech otázek', q('.teacher') === null && qa('.options li.right').length === 0);
  check('skrytí odpovědí nezastaví odpočet', timerHandle !== null);
  click('[data-act="peek"]');
  check('oko: odpověď jen u této otázky', q('.teacher') !== null && qa('.options li.right').length === 1);
  click('[data-act="peek"]');
  check('oko znovu skryje', q('.teacher') === null);
  click('[data-act="answers"]');
  check('přepínač zpět: odpověď vidět', q('.teacher') !== null && q('.eye') !== null && !q('.eye').classList.contains('off'));

  check('krok zpět je i u otázky', q('[data-act="undo"]') !== null);

  /* 4. nevěděl → dialog krádeže */
  click('[data-act="wrong"]');
  check('dialog krádeže místo rovnou krádeže', q('.steal-dialog') !== null && q('[data-act="steal-yes"]') !== null, txt('.sd-q'));
  check('dialog: nabídnut další tým', txt('.sd-team') === 'Veteráni', txt('.sd-team'));
  check('dialog: +500 za správnou', txt('.sd-terms').includes('+500'), txt('.sd-terms'));
  check('dialog: -500 za špatnou', txt('.sd-terms').includes('−500'), txt('.sd-terms'));
  check('dialog: čas 10 s (polovina z 20)', txt('.sd-terms').includes('10 s'), txt('.sd-terms'));
  check('dialog: krok zpět', q('.steal-dialog [data-act="undo"]') !== null);

  /* 5. odmítnutí */
  click('[data-act="steal-no"]');
  check('odmítnuto: bez bodu', q('.award.none') !== null && txt('.award').includes('odmítnuta'), txt('.award'));
  click('[data-act="next"]');
  check('po odmítnutí nikdo nic nemá', scores().every(s => s === '0'), JSON.stringify(scores()));
  check('střídání: na řadě Veteráni', txt('.turn-banner b') === 'Veteráni', txt('.turn-banner b'));

  /* 6. krádež vyšla — polovina a poloviční čas */
  const t2 = qa('.tile').find(t => !t.classList.contains('done'));
  const q2 = QUESTIONS.find(x => x.id === t2.dataset.qid);
  t2.click(); click('[data-act="show"]'); click('[data-act="options"]');
  click('[data-act="wrong"]');
  click('[data-act="steal-yes"]');
  check('krádež běží', q('[data-act="right"]') !== null, txt('.turnbox .who'));
  check('krádež: poloviční čas', txt('.tnum') === '10', txt('.tnum'));
  click('[data-act="right"]');
  const half = norm((q2.value * 50).toLocaleString('cs-CZ'));
  check('krádež +½ (' + half + ')', txt('.award.win').includes(half), txt('.award'));
  click('[data-act="next"]');
  check('skóre střelce krádeže = ' + half, scores()[2] === half, JSON.stringify(scores()));

  /* 7. krádež nevyšla — mínus polovina */
  const t3 = qa('.tile').find(t => !t.classList.contains('done'));
  const q3 = QUESTIONS.find(x => x.id === t3.dataset.qid);
  t3.click(); click('[data-act="show"]'); click('[data-act="options"]');
  click('[data-act="wrong"]');
  click('[data-act="steal-yes"]');
  const stealerName = txt('.turnbox .who').split(' — ')[0];
  click('[data-act="wrong"]');
  const minus = norm('-' + (q3.value * 50).toLocaleString('cs-CZ'));  // award používá ASCII minus
  check('krádež nevyšla: ' + minus, txt('.award.lose').includes(minus), txt('.award'));
  check('penalizace za krádcem', txt('.award.lose').includes(stealerName), txt('.award'));

  /* 8. undo u otázky (spletl jsem se) */
  click('[data-act="undo"]');
  check('undo: zpět do otázky', q('.turnbox') !== null && q('.award') === null, txt('.turnbox .lbl'));
  click('[data-act="wrong"]');   // znovu nevyšla
  click('[data-act="next"]');

  /* 8b. zavření otázky tlačítkem v liště */
  const before = qa('.tile.done').length;
  const notUsed = qa('.tile').find(t => !t.classList.contains('done'));
  notUsed.click();
  if (q('[data-act="show"]')) click('[data-act="show"]');
  click('[data-act="cancel"]');
  check('zavřít otázku: zpět na plán', q('.board') !== null && q('.qview') === null, txt('.board-foot'));
  check('zavřít otázku: dlaždice zůstala volná', qa('.tile.done').length === before);

  /* 9. nová hra se ptá */
  click('[data-act="new-game"]');
  check('nová hra: dialog s volbou', q('.overlay .dialog') !== null && q('[data-act="new-same"]') !== null && q('[data-act="new-fresh"]') !== null);
  click('[data-act="modal-close"]');
  check('nová hra: zrušit zavře dialog', q('.overlay') === null);
  click('[data-act="new-game"]');
  click('[data-act="new-same"]');
  check('stejné týmy: hra pokračuje', q('.board') !== null && q('.setup') === null);

  /* 10. dohrát do konce a podívat se na stupně vítězů */
  let guard = 0;
  while (!q('.podium') && guard < 80) {
    guard++;
    const t = qa('.tile').find(x => !x.classList.contains('done'));
    if (!t) break;
    t.click();
    if (q('[data-act="show"]')) click('[data-act="show"]');
    if (q('[data-act="options"]')) click('[data-act="options"]');
    if (q('[data-act="wrong"]')) click('[data-act="wrong"]');
    if (q('[data-act="steal-no"]')) click('[data-act="steal-no"]');
    if (q('[data-act="next"]')) click('[data-act="next"]');
  }
  check('konec: stupně vítězů', q('.podium') !== null, 'kroků=' + guard);
  check('pódium: tři místa', qa('.podium-step').length === 3, qa('.podium-step').length);
  check('pódium: zlato uprostřed', (qa('.podium-step')[1] || {}).classList && qa('.podium-step')[1].classList.contains('place-1'));

  /* 11. persistence */
  const raw = localStorage.getItem('perlicky-v1');
  check('stav uložen', !!raw && raw.includes('Nováci'), raw ? raw.length + ' znaků' : 'nic');
  click('[data-act="new-game"]');
  click('[data-act="new-fresh"]');
  check('nové týmy: zpět na nastavení', q('.setup') !== null);
  finish();
}

try {
  if (IS_DISPLAY_TEST) displayTests(); else controlTests();
} catch (e) {
  T.push('VÝJIMKA: ' + e.message + '\n' + e.stack);
  document.getElementById('out').textContent = T.join('\n');
  document.title = 'ERROR';
}
</script>
</body></html>
