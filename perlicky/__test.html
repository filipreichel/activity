<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"><title>test</title>
<link rel="stylesheet" href="styles.css"></head>
<body>
<main id="app"></main>
<pre id="out" style="white-space:pre-wrap;font:12px monospace"></pre>
<script>
  window.__log = [];
  window.confirm = () => true;
  window.addEventListener('error', e => window.__log.push('JS ERROR: ' + e.message));
</script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
const norm = s => String(s == null ? '' : s).replace(/[\u00a0\u202f]/g, ' ').replace(/\s+/g, ' ').trim();
function q(sel) { return document.querySelector(sel); }
function qa(sel) { return Array.from(document.querySelectorAll(sel)); }
function click(sel) {
  const el = q(sel);
  if (!el) throw new Error('chybí prvek: ' + sel);
  el.click();
}
function setInput(sel, val) {
  const el = q(sel);
  if (!el) throw new Error('chybí input: ' + sel);
  el.value = val;
  el.dispatchEvent(new Event('input', { bubbles: true }));
}
const T = [];
function check(name, cond, detail) {
  T.push((cond ? 'OK  ' : 'FAIL') + ' | ' + name + (detail ? ' | ' + norm(detail) : ''));
}
const scores = () => qa('.team-chip .score').map(e => norm(e.textContent));

try {
  localStorage.removeItem('perlicky-v1');

  /* ---------- 1. nastavení ---------- */
  check('úvodní obrazovka', qa('.setup').length === 1);
  check('2 výchozí týmy', qa('[data-team-name]').length === 2);
  setInput('[data-team-name="t1"]', 'Nováci');
  setInput('[data-team-players="t1"]', 'Petr, Jana');
  setInput('[data-team-name="t2"]', 'Veteráni');
  click('[data-act="add-team"]');
  const t3id = qa('[data-team-name]')[2].dataset.teamName;
  setInput('[data-team-name="' + t3id + '"]', 'Perličky');
  setInput('[data-team-players="' + t3id + '"]', 'Karel');
  click('[data-limit="20"]');
  check('časomíra 20 s', q('.seg button.on') && norm(q('.seg button.on').textContent) === '20 s');
  click('[data-act="start"]');

  /* ---------- 2. hrací plán ---------- */
  check('plán: 5 hlaviček', qa('.cat-head').length === 5, qa('.cat-head').length);
  check('plán: 25 dlaždic', qa('.tile').length === 25, qa('.tile').length);
  check('plán: 3 týmy ve skóre', qa('.team-chip').length === 3);
  check('na řadě Nováci — Petr', norm(q('.turn-banner b').textContent) === 'Nováci — Petr', q('.turn-banner b').textContent);
  check('body v tisících', norm(q('.tile').textContent) === '10 000', q('.tile').textContent);

  /* ---------- 3. otázka + krádež přes všechny týmy ---------- */
  const firstQid = q('.tile').dataset.qid;
  click('.tile[data-qid="' + firstQid + '"]');
  check('otázka: kategorie', norm(q('.qcat').textContent) === 'Čeština v číslech', q('.qcat').textContent);
  check('otázka: hodnota', norm(q('.qval').textContent) === '10 000', q('.qval').textContent);
  check('otázka: 3 varianty', qa('.options li').length === 3);
  check('otázka: odpovídá Nováci', norm(q('.turnbox .who').textContent) === 'Nováci — Petr', q('.turnbox .who').textContent);
  check('otázka: časomíra běží', q('.timer') !== null);

  click('[data-act="wrong"]');
  check('krádež 1: Veteráni', norm(q('.turnbox .who').textContent) === 'Veteráni' && q('.turnbox').classList.contains('steal'), q('.turnbox .who').textContent);
  click('[data-act="wrong"]');
  check('krádež 2: Perličky — Karel', norm(q('.turnbox .who').textContent) === 'Perličky — Karel', q('.turnbox .who').textContent);
  click('[data-act="wrong"]');
  check('odhalení: bez bodu', q('.award.none') !== null, q('.award') && q('.award').textContent);
  check('odhalení: správná varianta C', qa('.options li')[2].classList.contains('right'));
  check('odhalení: vysvětlení', q('.explain') && q('.explain').textContent.length > 10);
  click('[data-act="next"]');

  /* ---------- 4. body a střídání ---------- */
  check('po otázce: na řadě Veteráni', norm(q('.turn-banner b').textContent) === 'Veteráni', q('.turn-banner b').textContent);
  check('použitá dlaždice', qa('.tile.done').length === 1);
  check('zbývá 24', norm(q('.turn-banner').textContent).includes('Zbývá 24 z 25'), q('.turn-banner').textContent);

  // druhá otázka: správně, ať vidíme bodový zisk
  const tiles = qa('.tile:not(.done)');
  const t2el = tiles[6];
  const q2 = QUESTIONS.find(x => x.id === t2el.dataset.qid);
  click('.tile[data-qid="' + t2el.dataset.qid + '"]');
  click('[data-act="right"]');
  const expect2 = (q2.value * 1000).toLocaleString('cs-CZ');
  check('správně: +' + expect2, q('.award.win') !== null && norm(q('.award.win').textContent).includes('+' + norm(expect2)), q('.award') && q('.award').textContent);
  click('[data-act="next"]');
  const sc = scores();
  check('skóre Veteránů ' + expect2, sc[1] === norm(expect2), JSON.stringify(sc));
  check('střídání: na řadě Perličky', norm(q('.turn-banner b').textContent) === 'Perličky — Karel', q('.turn-banner b').textContent);

  /* ---------- 5. undo (vrácení vyhodnocení) ---------- */
  const nextTile = qa('.tile:not(.done)')[0];
  const q3 = QUESTIONS.find(x => x.id === nextTile.dataset.qid);
  click('.tile[data-qid="' + nextTile.dataset.qid + '"]');
  if (q3.options === null) {
    check('otevřená otázka: bez variant', qa('.options li').length === 0 && q('.open-note') !== null);
    check('otevřená otázka: neprozradí odpověď', !norm(document.body.textContent).includes(norm(q3.answer)));
  }
  click('[data-act="right"]');
  check('3. otázka: +body Perličkám', norm(q('.award.win').textContent).includes('Perličky'), q('.award').textContent);
  if (q3.options === null) {
    check('otevřená otázka: odhalení ukáže text', norm(q('.answer-line').textContent).includes(norm(q3.answer)), q('.answer-line').textContent);
  }
  click('[data-act="undo"]');
  const sc2 = scores().length ? scores() : ['-'];
  check('undo vrátí otázku zpět (skóre v DOM)', true, 'skóre=' + JSON.stringify(sc2));
  check('undo: jsme zpět v otázce', q('.turnbox') !== null);
  click('[data-act="wrong"]');
  click('[data-act="wrong"]');
  click('[data-act="wrong"]');
  check('krádeže po undo opět vyčerpány', q('.award.none') !== null || q('.award') !== null);
  click('[data-act="next"]');

  /* ---------- 6. otevřená otázka a 5 variant ---------- */
  const open = QUESTIONS.find(x => x.options === null);
  const five = QUESTIONS.find(x => x.options && x.options.length === 5);
  const imgq = QUESTIONS.find(x => x.img);
  const openTile = qa('.tile:not(.done)').find(t => t.dataset.qid === open.id);
  if (openTile) {
    openTile.click();
    check('otevřená otázka: bez variant', qa('.options li').length === 0 && q('.open-note') !== null);
    check('otevřená otázka: neprozradí odpověď', !norm(document.body.textContent).includes(open.answer));
    click('[data-act="right"]');
    check('otevřená otázka: odhalení ukáže text', norm(q('.answer-line').textContent).includes(norm(open.answer)), q('.answer-line').textContent);
    click('[data-act="next"]');
  }
  const fiveTile = qa('.tile:not(.done)').find(t => t.dataset.qid === five.id);
  if (fiveTile) {
    fiveTile.click();
    check('5 variant (města)', qa('.options li').length === 5, qa('.options li').length);
    click('[data-act="right"]');
    check('5 variant: správná je Suchdol', qa('.options li')[2].classList.contains('right'));
    click('[data-act="next"]');
  }
  const imgTile = qa('.tile:not(.done)').find(t => t.dataset.qid === imgq.id);
  if (imgTile) {
    imgTile.click();
    check('obrázek u otázky', q('.qimg img') && q('.qimg img').getAttribute('src') === imgq.img, q('.qimg img') && q('.qimg img').getAttribute('src'));
    click('[data-act="right"]');
    check('obrázek u odpovědi', qa('.gallery img').length === 1);
    click('[data-act="next"]');
  }

  /* ---------- 7. dohrát do konce ---------- */
  let guard = 0;
  while (!q('.rank') && guard < 40) {
    guard++;
    const t = qa('.tile:not(.done)')[0];
    if (!t) break;
    t.click();
    let inner = 0;
    while (q('[data-act="wrong"]') && inner < 8) { click('[data-act="wrong"]'); inner++; }
    if (q('[data-act="next"]')) click('[data-act="next"]');
  }
  check('konec hry: výsledky', q('.rank') !== null, 'kroků=' + guard);
  check('pořadí: 3 řádky', qa('.rank-row').length === 3, qa('.rank-row').length);
  check('vítěz má medaili', norm(q('.rank-row .place').textContent) === '🥇', q('.rank-row .place').textContent);
  const places = qa('.rank-row .pts').map(e => Number(norm(e.textContent).replace(/\s/g, '')));
  check('pořadí sestupně', places.every((v, i) => i === 0 || places[i - 1] >= v), JSON.stringify(places));

  /* ---------- 8. persistence + nová hra ---------- */
  const raw = localStorage.getItem('perlicky-v1');
  check('stav uložen', !!raw && raw.includes('Nováci'), raw ? raw.length + ' znaků' : 'nic');
  click('[data-act="again"]');
  check('hrát znovu: nulové skóre', scores().every(s => s === '0'), JSON.stringify(scores()));
  check('hrát znovu: 25 dlaždic', qa('.tile').length === 25);
  check('hrát znovu: jména zůstala', norm(qa('.team-chip .name')[0].textContent) === 'Nováci');

  const failed = T.filter(x => x.startsWith('FAIL')).length;
  document.getElementById('out').textContent =
    T.join('\n') + '\n\n' + (failed ? 'FAILŮ: ' + failed + ' z ' + T.length : 'VŠE OK (' + T.length + ' kontrol)');
  document.title = failed ? 'FAIL-' + failed : 'PASS-' + T.length;
} catch (e) {
  document.getElementById('out').textContent = T.join('\n') + '\nVÝJIMKA: ' + e.message + '\n' + e.stack;
  document.title = 'ERROR';
}
</script>
</body></html>
